name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit and integration tests (Jest)
        run: npm test
      - name: API tests (Postman / Newman)
        run: |
          STORAGE=memory npm start &
          sleep 3
          npx newman run postman/inventory.postman_collection.json
